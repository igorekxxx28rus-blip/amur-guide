<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Главная - Путеводитель по Амурской области</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #2f6f4e;
            color: white;
            padding: 20px;
            text-align: center;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        nav {
            margin-top: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        nav a.active {
            color: #ffd700;
            text-decoration: underline;
        }

        .container {
            max-width: 1200px;
            margin: 120px auto 20px auto;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .place {
            width: 300px;
            height: 200px;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            transition: transform 0.5s, box-shadow 0.5s;
            cursor: pointer;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s forwards;
        }

        .place img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .place:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .place:hover img {
            transform: scale(1.1) rotate(2deg);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        footer {
            text-align: center;
            padding: 15px;
            background: #ddd;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<header>
    <h1>Путеводитель по Амурской области</h1>
    <nav>
        <a href="index.html" class="active">Главная</a>
        <a href="cities.html">Города</a>
        <a href="nature.html">Природа</a>
        <a href="animals.html">Животный мир</a>
        <a href="history.html">История</a>
        <a href="culture.html">Культура</a>
        <a href="sights.html">Достопримечательности</a>
    </nav>
</header>

<div class="container">
    <a href="cities.html" class="place" style="animation-delay:0s;"><img src="images/foto1.jpg" alt="Город"></a>
    <a href="cities.html" class="place" style="animation-delay:0.1s;"><img src="images/svobodny.jpg" alt="Город"></a>
    <a href="nature.html" class="place" style="animation-delay:0.2s;"><img src="images/foto2.jpg" alt="Природа"></a>
    <a href="nature.html" class="place" style="animation-delay:0.3s;"><img src="images/khingan.jpg" alt="Природа"></a>
    <a href="animals.html" class="place" style="animation-delay:0.4s;"><img src="images/tiger.jpg" alt="Животный мир"></a>
    <a href="animals.html" class="place" style="animation-delay:0.5s;"><img src="images/leopard.jpg" alt="Животный мир"></a>
    <a href="history.html" class="place" style="animation-delay:0.6s;"><img src="images/albazin.jpg" alt="История"></a>
    <a href="history.html" class="place" style="animation-delay:0.7s;"><img src="images/transsib.jpg" alt="История"></a>
    <a href="culture.html" class="place" style="animation-delay:0.8s;"><img src="images/museum.jpg" alt="Культура"></a>
    <a href="culture.html" class="place" style="animation-delay:0.9s;"><img src="images/theater.jpg" alt="Культура"></a>
    <a href="sights.html" class="place" style="animation-delay:1s;"><img src="images/vostochny.jpg" alt="Достопримечательности"></a>
    <a href="sights.html" class="place" style="animation-delay:1.1s;"><img src="images/festival.jpg" alt="Достопримечательности"></a>
</div>

<footer>
    <p>© 2026 Путеводитель по Амурской области</p>
</footer>

</body>
</html>
