<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Животный мир - Амурская область</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="splash"><h1>Амурская область</h1></div>

<header>
    <nav>
        <a href="index.html">Главная</a>
        <a href="cities.html">Города</a>
        <a href="nature.html">Природа</a>
        <a href="animals.html" class="active">Животный мир</a>
        <a href="history.html">История</a>
        <a href="culture.html">Культура</a>
        <a href="sights.html">Достопримечательности</a>
    </nav>
</header>

<div class="container">
    <div class="place" style="animation-delay:0s;">
        <img src="images/amur_tiger.jpg" alt="Амурский тигр">
        <div class="place-content"><h3>Амурский тигр</h3></div>
    </div>
    <div class="place" style="animation-delay:0.1s;">
        <img src="images/leopard.jpg" alt="Дальневосточный леопард">
        <div class="place-content"><h3>Дальневосточный леопард</h3></div>
    </div>
    <div class="place" style="animation-delay:0.2s;">
        <img src="images/brown_bear.jpg" alt="Бурый медведь">
        <div class="place-content"><h3>Бурый медведь</h3></div>
    </div>
    <div class="place" style="animation-delay:0.3s;">
        <img src="images/sobol.jpg" alt="Соболь">
        <div class="place-content"><h3>Соболь</h3></div>
    </div>
</div>

<footer>
    <p>© 2026 Путеводитель по Амурской области</p>
</footer>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const splash = document.getElementById('splash');
    if (!sessionStorage.getItem('splashShown')) {
        sessionStorage.setItem('splashShown', 'true');
        setTimeout(() => splash.classList.add('fade-out'), 1000);
        setTimeout(() => splash.style.display = 'none', 2000);
    } else {
        splash.style.display = 'none';
    }
});
</script>

</body>
</html>
