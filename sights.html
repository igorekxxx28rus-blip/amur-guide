<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="splash"><h1>Амурская область</h1></div>

<header>
    <nav>
        <a href="index.html">Главная</a>
        <a href="cities.html">Города</a>
        <a href="nature.html">Природа</a>
        <a href="animals.html">Животный мир</a>
        <a href="history.html">История</a>
        <a href="culture.html">Культура</a>
        <a href="sights.html" class="active">Достопримечательности</a>
    </nav>
</header>

<div class="container">
    <div class="place" style="animation-delay:0s;">
        <img src="images/vostochny.jpg" alt="Космодром Восточный">
        <div class="place-content"><h3>Космодром «Восточный»</h3></div>
    </div>
    <div class="place" style="animation-delay:0.1s;">
        <img src="images/zeyskaya_ges.jpg" alt="Зейская ГЭС">
        <div class="place-content"><h3>Зейская ГЭС</h3></div>
    </div>
    <div class="place" style="animation-delay:0.2s;">
        <img src="images/triumphal_arch.jpg" alt="Триумфальная арка">
        <div class="place-content"><h3>Триумфальная арка</h3></div>
    </div>
    <div class="place" style="animation-delay:0.3s;">
        <img src="images/blag_naberezhnaya.jpg" alt="Набережная Благовещенска">

</div>

<footer>
    <p>© 2026 Путеводитель по Амурской области</p>
</footer>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const splash = document.getElementById('splash');
    if (!sessionStorage.getItem('splashShown')) {
        sessionStorage.setItem('splashShown', 'true');
        setTimeout(() => splash.classList.add('fade-out'), 1000);
        setTimeout(() => splash.style.display = 'none', 2000);
    } else {
        splash.style.display = 'none';
    }
});
</script>

</body>
