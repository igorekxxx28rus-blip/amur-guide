<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Культура - Амурская область</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="splash"><h1>Амурская область</h1></div>

<header>
    <nav>
        <a href="index.html">Главная</a>
        <a href="cities.html">Города</a>
        <a href="nature.html">Природа</a>
        <a href="animals.html">Животный мир</a>
        <a href="history.html">История</a>
        <a href="culture.html" class="active">Культура</a>
        <a href="sights.html">Достопримечательности</a>
    </nav>
</header>

<div class="container">
    <div class="place" style="animation-delay:0s;">
        <img src="images/museum.jpg" alt="Амурский областной краеведческий музей">
        <div class="place-content"><h3>Амурский областной краеведческий музей</h3></div>
    </div>
    <div class="place" style="animation-delay:0.1s;">
        <img src="images/theater.jpg" alt="Амурский театр драмы">
        <div class="place-content"><h3>Амурский театр драмы</h3></div>
    </div>
    <div class="place" style="animation-delay:0.2s;">
        <img src="images/art_center.jpg" alt="Центр современного искусства Благовещенск">
        <div class="place-content"><h3>Центр современного искусства Благовещенск</h3></div>
    </div>
    <div class="place" style="animation-delay:0.3s;">
        <img src="images/art_gallery.jpg" alt="Художественная галерея">
        <div class="place-content"><h3>Художественная галерея</h3></div>
    </div>
    <div class="place" style="animation-delay:0.4s;">
        <img src="images/culture_festival.jpg" alt="Фестиваль культуры">
        <div class="place-content"><h3>Фестиваль культуры</h3></div>
    </div>
</div>

<footer>
    <p>© 2026 Путеводитель по Амурской области</p>
</footer>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const splash = document.getElementById('splash');
    if (!sessionStorage.getItem('splashShown')) {
        sessionStorage.setItem('splashShown', 'true');
        setTimeout(() => splash.classList.add('fade-out'), 1000);
        setTimeout(() => splash.style.display = 'none', 2000);
    } else {
        splash.style.display = 'none';
    }
});
</script>

</body>
</html>
